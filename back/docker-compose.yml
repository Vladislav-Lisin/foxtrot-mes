services:
  postgres:
    image: postgres:16-alpine
    container_name: foxtrot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foxtrot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # 5432 на хосте уже занят локальным systemd-сервисом postgresql - наружу торчит 5433,
      # backend внутри compose-сети всё равно ходит на postgres:5432, это не задевает.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-foxtrot}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: foxtrot-backend
    restart: unless-stopped
    # Тоже network_mode: host - см. подробный комментарий у media-service ниже. Изначально
    # тут была попытка достучаться до host-networked media-service через host.docker.internal/
    # шлюз bridge-сети (172.18.0.1) - оба варианта зависали намертво (connection timed out),
    # хотя ufw был выключен ("Firewall not enabled") и дело было не в нём - похоже, докеровский
    # iptables/FORWARD-чейн просто не пропускает трафик от bridge-контейнера к процессу,
    # слушающему напрямую на хосте. host-networking для backend тоже полностью убирает эту
    # прослойку - localhost внутри контейнера теперь и есть настоящий localhost хоста.
    network_mode: host
    environment:
      # postgres по-прежнему на обычной bridge-сети и публикует 5433 на хосте (см. "ports:"
      # у postgres) - при network_mode: host backend видит этот порт как свой localhost.
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5433/${POSTGRES_DB:-foxtrot}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL:-false}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CALL_JWT_SECRET: ${CALL_JWT_SECRET:?set CALL_JWT_SECRET in .env}
      CALL_JWT_EXPIRATION: ${CALL_JWT_EXPIRATION:-60000}
      # media-service тоже на network_mode: host - тот же localhost.
      MEDIA_SERVICE_BASE_URL: http://localhost:4000
      # А это то, что уходит в браузер (CallResponse.mediaServiceUrl) - должен быть
      # реально достижим с клиента, localhost:4000 работает только при локальном docker-compose
      MEDIA_SERVICE_PUBLIC_URL: ${MEDIA_SERVICE_PUBLIC_URL:-http://localhost:4000}
      MEDIA_SERVICE_INTERNAL_SECRET: ${MEDIA_SERVICE_INTERNAL_SECRET:?set MEDIA_SERVICE_INTERNAL_SECRET in .env}
      APP_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS: ${APP_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}
      PORT: 8080
      # Сервер маленький (1 CPU / ~1.8 ГБ RAM) - JVM по умолчанию может отъесть больше,
      # чем реально нужно приложению такого размера, не оставляя памяти Postgres/
      # media-service/фронту. JAVA_TOOL_OPTIONS - стандартная переменная, которую java
      # подхватывает сама, без правки Dockerfile/ENTRYPOINT.
      JAVA_TOOL_OPTIONS: "-Xmx400m -XX:MaxMetaspaceSize=128m"
      # Путь ВНУТРИ контейнера - фиксированный, реальное расположение на хосте
      # задаётся через volumes ниже (UPLOADS_HOST_DIR), как и у certs у nginx.
      APP_UPLOADS_DIR: /app/uploads
      LOG_DIR: /app/logs
    volumes:
      # Фон чата (загруженные пользователями картинки) - бинд-маунт, иначе файлы
      # терялись бы при каждом пересоздании контейнера (--force-recreate при деплое).
      - ${UPLOADS_HOST_DIR:-./uploads}:/app/uploads
      # Логи приложения (app.log, errors.log, activity.log) - видны на хосте в ./logs
      - ${LOG_HOST_DIR:-./logs}:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      media-service:
        condition: service_started

  media-service:
    build:
      context: ../media-service
      dockerfile: Dockerfile
    container_name: foxtrot-media-service
    restart: unless-stopped
    # ВАЖНО: раньше это был обычный сервис с "ports:" (Docker NAT/port-publishing) и
    # MEDIASOUP_ANNOUNCED_IP=127.0.0.1 - на практике это не заработало. WebRTC-браузер слал
    # ICE-кандидату 127.0.0.1:400xx STUN-запросы, но iceState навсегда оставался "new":
    # проброс loopback-адреса через Docker NAT/hairpin для UDP на пользовательской (не
    # дефолтной) bridge-сети требует sysctl net.ipv4.conf.<bridge>.route_localnet=1,
    # который Docker не всегда включает сам. network_mode: host убирает Docker NAT из
    # уравнения полностью - тот же приём уже применён ниже для coturn/nginx по той же
    # причине (широкий диапазон портов + WebRTC не дружит с обычным Docker-проброс).
    network_mode: host
    environment:
      PORT: 4000
      CALL_JWT_SECRET: ${CALL_JWT_SECRET:?set CALL_JWT_SECRET in .env}
      MEDIA_SERVICE_INTERNAL_SECRET: ${MEDIA_SERVICE_INTERNAL_SECRET:?set MEDIA_SERVICE_INTERNAL_SECRET in .env}
      # localhost, а не "backend" - с network_mode: host своего DNS-имени в compose-сети нет,
      # только реальный хост. backend публикует 8080 на хосте (см. "ports:" у backend).
      SPRING_BOOT_INTERNAL_URL: http://localhost:8080
      MEDIASOUP_RTC_MIN_PORT: ${MEDIASOUP_RTC_MIN_PORT:-40000}
      MEDIASOUP_RTC_MAX_PORT: ${MEDIASOUP_RTC_MAX_PORT:-49999}
      # НЕ 127.0.0.1 - см. подробный комментарий в back/.env.example. Firefox (и не только)
      # не собирает loopback как СВОЙ локальный ICE-кандидат, у него это реальный LAN IP -
      # пара "реальный IP (браузер) <-> 127.0.0.1 (сервер)" физически невалидна, ICE всегда
      # проваливается, при этом сигнализация (produce/connect-transport) остаётся "ok" и
      # маскирует проблему. Нужен реальный IP машины (см. `ip route`/`hostname -I`), даже
      # если браузер и media-service - буквально один и тот же хост.
      MEDIASOUP_ANNOUNCED_IP: ${MEDIASOUP_ANNOUNCED_IP:?set MEDIASOUP_ANNOUNCED_IP in .env - see comment above}
      # Оба пустые по умолчанию - TURN тогда просто отключён (см. media-service/.env.example).
      # Для прода включите сервис coturn ниже (профиль "turn") и укажите те же значения там.
      TURN_HOST: ${TURN_HOST:-}
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_UDP_PORT: ${TURN_UDP_PORT:-3478}
      # Public TLS/443 is routed by HAProxy using the turn.<domain> SNI.
      TURN_TLS_PORT: ${TURN_TLS_PORT:-443}
      STUN_URLS: ${STUN_URLS:-stun:stun.l.google.com:19302}
      CALL_SESSION_GRACE_SECONDS: ${CALL_SESSION_GRACE_SECONDS:-45}
      CALL_ROOM_IDLE_SECONDS: ${CALL_ROOM_IDLE_SECONDS:-120}
      WS_HEARTBEAT_INTERVAL_MS: ${WS_HEARTBEAT_INTERVAL_MS:-10000}
      WS_HEARTBEAT_TIMEOUT_MS: ${WS_HEARTBEAT_TIMEOUT_MS:-30000}
    # Полный продовый диапазон - 40000-49999 (см. Foxtrot Calls - Roadmap §6.6/§7) - с
    # network_mode: host просто расширьте MEDIASOUP_RTC_MIN/MAX_PORT, никаких "ports:" не
    # нужно вообще - процесс сам слушает нужные порты прямо на хосте.

  frontend:
    build:
      context: ../front
      dockerfile: Dockerfile
      target: runner
    container_name: foxtrot-frontend
    restart: unless-stopped
    # Тот же network_mode: host, что и у остальных - nginx (профиль proxy) ожидает найти
    # его на 127.0.0.1:3000 (см. nginx.conf), плюс так проще всего: не нужно тащить свой
    # docker-compose.yml из front/ отдельным проектом.
    network_mode: host
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      # Тот же домен, что и у сайта целиком - nginx проксирует /auth|chats|settings|calls
      # на backend в рамках ОДНОГО origin, отдельный CORS-запрос на другой хост не нужен.
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:?set NUXT_PUBLIC_API_BASE in .env (https://ваш-домен)}

  # Опционален - только для прода/реальной сети. TURN_HOST должен быть DNS-именем turn.*,
  # а TLS-сертификат coturn должен содержать это имя. TLS наружу идёт через HAProxy :443.
  # Запуск: docker compose --profile proxy --profile turn up.
  coturn:
    image: coturn/coturn:4.6-alpine
    container_name: foxtrot-coturn
    restart: unless-stopped
    profiles: ["turn"]
    # Та же причина, что у media-service выше: TURN-релею нужен широкий диапазон портов,
    # через обычный "ports:" это непрактично - с host-networking процесс слушает прямо
    # на портах хоста, без прослойки Docker NAT.
    network_mode: host
    environment:
      # Специально без ":?required" здесь - Compose подставляет переменные ДО фильтрации
      # по профилям, так что "обязательная" переменная у неактивного по умолчанию сервиса
      # ломает даже обычный "docker compose up" без --profile turn. Проверка "не забыли
      # ли задать" сделана ниже, в самой команде - она сработает только когда контейнер
      # реально запускается, то есть только при активном профиле turn.
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_REALM: ${TURN_REALM:-foxtrot.local}
      TURN_HOST: ${TURN_HOST:-}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-}
      TURN_LISTENING_IP: ${TURN_LISTENING_IP:-}
      TURN_UDP_PORT: ${TURN_UDP_PORT:-3478}
      TURN_MIN_PORT: ${TURN_MIN_PORT:-50000}
      TURN_MAX_PORT: ${TURN_MAX_PORT:-59999}
      TURN_TLS_LISTEN_PORT: ${TURN_TLS_LISTEN_PORT:-5349}
      TURN_TLS_CERT_FILE: ${TURN_TLS_CERT_FILE:-/etc/coturn/certs/fullchain.pem}
      TURN_TLS_KEY_FILE: ${TURN_TLS_KEY_FILE:-/etc/coturn/certs/privkey.pem}
    volumes:
      - ${NGINX_CERTS_DIR:-./certs}:/etc/coturn/certs:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$TURN_SECRET" ]; then
          echo "TURN_SECRET is not set - add it to back/.env before using --profile turn" >&2
          exit 1
        fi
        if [ ! -r "$$TURN_TLS_CERT_FILE" ] || [ ! -r "$$TURN_TLS_KEY_FILE" ]; then
          echo "TURN TLS certificate/key are not readable" >&2
          exit 1
        fi
        # TURN_HOST is a public DNS name; coturn's relay mapping requires an IP.
        EXTRA_ARGS=""
        if [ -n "$$TURN_EXTERNAL_IP" ]; then
          if [ -n "$$TURN_LISTENING_IP" ]; then
            if [ "$$TURN_EXTERNAL_IP" = "$$TURN_LISTENING_IP" ]; then
              EXTRA_ARGS="--external-ip=$$TURN_EXTERNAL_IP --relay-ip=$$TURN_LISTENING_IP --listening-ip=$$TURN_LISTENING_IP"
            else
              EXTRA_ARGS="--external-ip=$$TURN_EXTERNAL_IP/$$TURN_LISTENING_IP --relay-ip=$$TURN_LISTENING_IP --listening-ip=$$TURN_LISTENING_IP"
            fi
          else
            EXTRA_ARGS="--external-ip=$$TURN_EXTERNAL_IP"
          fi
        elif [ -n "$$TURN_LISTENING_IP" ]; then
          EXTRA_ARGS="--relay-ip=$$TURN_LISTENING_IP --listening-ip=$$TURN_LISTENING_IP"
        fi
        exec turnserver -n --log-file=stdout \
          --listening-port="$$TURN_UDP_PORT" --tls-listening-port="$$TURN_TLS_LISTEN_PORT" \
          --cert="$$TURN_TLS_CERT_FILE" --pkey="$$TURN_TLS_KEY_FILE" \
          --no-tlsv1 --no-tlsv1_1 \
          --min-port="$$TURN_MIN_PORT" --max-port="$$TURN_MAX_PORT" \
          --use-auth-secret --static-auth-secret="$$TURN_SECRET" \
          --realm="$$TURN_REALM" --no-cli $$EXTRA_ARGS

  # Опционален - единая точка входа 443 с TLS для реальной сети (без него backend/media-service/
  # frontend торчат отдельными портами без HTTPS - браузер не даст доступ к камере/микрофону).
  # Запуск: docker compose --profile proxy up. Предполагает, что backend (8080),
  # media-service (4000) и фронт (3000, свой отдельный docker-compose в front/) уже
  # опубликовали порты на хосте - host-networking видит их все через 127.0.0.1, по той же
  # причине, что и у media-service/coturn выше.
  nginx:
    build:
      context: ../nginx
      dockerfile: Dockerfile
    container_name: foxtrot-nginx
    restart: unless-stopped
    profiles: ["proxy"]
    network_mode: host
    volumes:
      # Host-bind, а не именованный volume - сюда кладутся настоящие Let's Encrypt
      # сертификаты (certbot certonly --standalone), не автосгенерированный self-signed
      # (см. 50-self-signed-cert.sh - он используется только если fullchain.pem ещё нет,
      # то есть локально/до первого certbot run).
      - ${NGINX_CERTS_DIR:-./certs}:/etc/nginx/certs
    depends_on:
      backend:
        condition: service_started
      media-service:
        condition: service_started
      frontend:
        condition: service_started

  # TCP/TLS SNI multiplexing lets HTTPS and TURN/TLS share public port 443. HAProxy
  # passes HTTPS to nginx with PROXY protocol and passes turn.* TLS through to coturn.
  haproxy:
    image: haproxy:3.2-alpine
    container_name: foxtrot-haproxy
    restart: unless-stopped
    profiles: ["proxy"]
    network_mode: host
    volumes:
      - ../haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    command: ["haproxy", "-W", "-db", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
    depends_on:
      nginx:
        condition: service_started

volumes:
  postgres_data:
