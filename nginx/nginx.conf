worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  client_max_body_size 60m;

  gzip              on;
  gzip_vary         on;
  gzip_proxied      any;
  gzip_comp_level   5;
  gzip_min_length   1024;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    image/svg+xml
    font/woff2;

  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;

  # network_mode: host на уровне контейнера (см. docker-compose.yml) - "127.0.0.1" здесь
  # это хост-машина, где back/front/media-service уже опубликовали свои порты независимо
  # друг от друга (каждый - свой отдельный docker-compose проект).
  upstream backend_upstream   { server 127.0.0.1:8080; }
  upstream frontend_upstream  { server 127.0.0.1:3000; }
  upstream media_upstream     { server 127.0.0.1:4000; }

  # ---------- редирект HTTP -> HTTPS ----------
  server {
    listen 80;
    server_name _;

    location = /health {
      return 200 "ok";
      add_header Content-Type text/plain;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ---------- основное приложение: фронт + Java REST/STOMP-WS ----------
  server {
    # HAProxy routes HTTPS SNI here and sends PROXY protocol to preserve the client IP.
    listen 4443 ssl proxy_protocol;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    location = /health {
      return 200 "ok";
      add_header Content-Type text/plain;
    }

    # Чат STOMP/SockJS - тот же WS-эндпоинт, что уже слушает Spring Boot.
    location /ws {
      proxy_pass http://backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
    }

    location ~ ^/(auth|chats|settings|calls)(/|$) {
      proxy_pass http://backend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Загруженные файлы (аватарки, фоны чатов, фото и видео в сообщениях) отдаёт бэкенд.
    # Без этого маршрута запрос уходил на фронтенд, и картинки не открывались ("avatar" вместо фото).
    # Имена файлов - UUID, поэтому кэшировать можно надолго.
    location /uploads/ {
      proxy_pass http://backend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      expires 7d;
    }

    # /internal/** - канал media-service -> Spring Boot, снаружи доступа быть не должно
    # (защищён ещё и секретом на самом бэкенде, но снаружи его вообще не видно - лишний слой).
    location /internal/ {
      deny all;
      return 404;
    }

    location /_nuxt/ {
      proxy_pass http://frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
      proxy_pass http://frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # ---------- media-service: отдельный порт, без переписывания путей ----------
  # Так фронту не нужно ничего знать про префиксы - MEDIA_SERVICE_PUBLIC_URL=https://host:8443
  # и он сам допишет /ws?token=..., ровно как для голого http://localhost:4000 в разработке.
  # Сам медиапоток (UDP/TCP) как шёл напрямую в media-service мимо nginx, так и идёт -
  # проксируется только WSS-сигнализация.
  server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    location / {
      proxy_pass http://media_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
    }
  }
}
