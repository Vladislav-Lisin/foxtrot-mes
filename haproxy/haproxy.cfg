global
  log stdout format raw local0
  maxconn 2048

defaults
  log global
  mode tcp
  timeout connect 5s
  timeout client 1h
  timeout server 1h
  timeout tunnel 1h

frontend tls_ingress
  bind :443
  tcp-request inspect-delay 5s
  tcp-request content accept if { req.ssl_hello_type 1 }
  acl turn_sni req.ssl_sni -m reg -i ^turn\.
  use_backend coturn_tls if turn_sni
  default_backend https_nginx

backend https_nginx
  server nginx 127.0.0.1:4443 send-proxy-v2

backend coturn_tls
  server coturn 127.0.0.1:5349
