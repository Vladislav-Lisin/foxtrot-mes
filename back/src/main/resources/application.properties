spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/foxtrot}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Отдельный секрет для короткоживущих call-token (доступ к конкретному звонку в media-service).
call.jwt.secret=${CALL_JWT_SECRET}
call.jwt.expiration=${CALL_JWT_EXPIRATION:60000}

# media-service.base-url - куда бэкенд сам стучится (внутренняя сеть/VPC, POST /rooms и т.д.).
# media-service.public-url - что отдаём фронту в CallResponse для WSS-подключения браузера.
media-service.base-url=${MEDIA_SERVICE_BASE_URL:http://localhost:4000}
media-service.public-url=${MEDIA_SERVICE_PUBLIC_URL:http://localhost:4000}
media-service.internal-secret=${MEDIA_SERVICE_INTERNAL_SECRET}

app.websocket.allowed-origin-patterns=${APP_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,http://[::1]:*}
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}
server.port=${PORT:8080}

# Фон чата (загруженная пользователем картинка) - локальный диск, без облачного хранилища
app.uploads.dir=${APP_UPLOADS_DIR:./uploads}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
